services:
  db:
    image: postgres:15-alpine
    container_name: marketplace-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - marketplace-network

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - marketplace-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
    container_name: marketplace-v2
    ports:
      - "3001:3001"
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=marketplace
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=jwt_super_secret_key_change_in_production
      - JWT_REFRESH_SECRET=jwt_refresh_super_secret_key_change_in_production
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:3001,http://187.77.139.103:3001
    volumes:
      - ./backend/storage:/app/backend/storage
    restart: unless-stopped
    networks:
      - marketplace-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  marketplace-network:
    driver: bridge
